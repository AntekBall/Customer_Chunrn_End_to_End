name: churn-local

services:
  api:
    build: .
    image: churn-engine:local
    environment:
      CHURN_BUNDLE_DIRECTORY: /bundle
    volumes:
      - type: bind
        source: ${CHURN_LOCAL_BUNDLE:-./artifacts/serving_v1}
        target: /bundle
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${CHURN_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    init: true
    stop_grace_period: 30s

  dashboard:
    build: .
    image: churn-engine:local
    command: ["python", "-m", "uvicorn", "src.frontend.asgi:app", "--host", "0.0.0.0", "--port", "8050", "--workers", "1"]
    environment:
      CHURN_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${CHURN_DASH_PORT:-8050}:8050"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/_dash-layout', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    init: true