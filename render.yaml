services:
  - type: web
    name: churn-engine-demo
    runtime: python
    plan: free
    buildCommand: uv sync --locked --only-group serving
    startCommand: uv run --locked --only-group serving python -m src.web
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: UV_PYTHON_DOWNLOADS
        value: never
      - key: CHURN_BUNDLE_DIRECTORY
        value: deploy/demo_bundle
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
