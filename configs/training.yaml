# Training-only cross-validation; validation is for finalist comparison.
random_seed: 42

data:
  split_manifest: 'data\processed\customer_split_seed42_v1.parquet'
  feature_sql: 'sql\02_feature_engineering.sql'

cross_validation:
  n_splits: 3
  shuffle: true

optimization:
  metric: average_precision
  direction: maximize
  trials_per_model: 20
  timeout_seconds_per_model: 3600
  parallel_trials: 1

evaluation:
  metrics:
    - average_precision
    - roc_auc
    - log_loss
    - brier_score
  targeting_fractions:
    - 0.10
    - 0.20

mlflow:
  experiment_name: customer-churn-model-comparison
  tracking_directory: 'mlruns'
  log_trial_models: false
  log_finalist_models: true

models:
  hist_gradient_boosting:
    enabled: true
    fixed_parameters:
      early_stopping: false

  lightgbm:
    enabled: true
    fixed_parameters:
      objective: binary
      n_jobs: 2

  xgboost:
    enabled: true
    fixed_parameters:
      objective: binary:logistic
      tree_method: hist
      eval_metric: logloss
      n_jobs: 2

  random_forest:
    enabled: true
    fixed_parameters:
      n_jobs: 2

  catboost:
    enabled: true
    fixed_parameters:
      loss_function: Logloss
      thread_count: 2
      allow_writing_files: false